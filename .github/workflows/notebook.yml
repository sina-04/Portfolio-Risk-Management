name: Notebook validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install "nbformat>=5.9"
      - name: Validate notebook structure and privacy
        shell: python
        run: |
          import nbformat
          from pathlib import Path

          path = Path("Portfolio Management Jupyter Notebook.ipynb")
          notebook = nbformat.read(path, as_version=4)
          assert notebook.cells, "Notebook has no cells"
          for cell in notebook.cells:
              if cell.cell_type == "code":
                  assert cell.execution_count is None, "Clear execution counts"
                  assert not cell.outputs, "Clear notebook outputs"
          print(f"Validated {len(notebook.cells)} cells")
